<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuning Day Cazis 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;700&display=swap');
  :root { --bg:#0a0a0a; --surface:#141414; --border:#2a2a2a; --accent:#e63a2e; --accent2:#ff6b35; --text:#f0f0f0; --muted:#888; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1rem; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:4px; color:var(--muted); margin-bottom:2rem; text-align:center; }
  .logo span { color:var(--accent); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2.5rem 2rem; width:100%; max-width:380px; text-align:center; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:3.5rem; letter-spacing:2px; margin-bottom:0.5rem; background:linear-gradient(135deg,#fff 40%,var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .subtitle { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; letter-spacing:1px; text-transform:uppercase; }
  label { display:block; text-align:left; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:0.75rem; }
  input[type=number] { width:100%; background:var(--bg); border:2px solid var(--border); border-radius:10px; color:var(--text); font-family:'Bebas Neue',sans-serif; font-size:2.5rem; text-align:center; padding:1rem; outline:none; -moz-appearance:textfield; transition:border-color 0.2s; }
  input::-webkit-inner-spin-button { -webkit-appearance:none; }
  input:focus { border-color:var(--accent); }
  .btn { width:100%; margin-top:1.5rem; padding:1rem; border:none; border-radius:10px; font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:3px; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }
  .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--muted); margin-top:0.75rem; font-size:1rem; }
  .big-number { font-family:'Bebas Neue',sans-serif; font-size:6rem; line-height:1; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .confirm-text { color:var(--muted); margin:0.5rem 0 1.5rem; }
  .checkmark { font-size:4rem; margin-bottom:1rem; animation:pop 0.4s ease; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .done-title { font-family:'Bebas Neue',sans-serif; font-size:2.5rem; letter-spacing:2px; }
  .done-sub { color:var(--muted); margin-top:0.5rem; }
  .voted-for { margin-top:1rem; font-size:0.85rem; color:var(--muted); }
  .voted-for span { color:var(--accent2); font-family:'Bebas Neue',sans-serif; font-size:1.2rem; }
  .error { color:var(--accent); font-size:0.85rem; margin-top:0.5rem; min-height:1.2em; }
  .loading { color:var(--muted); letter-spacing:2px; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .footer { margin-top:2rem; color:var(--border); font-size:0.75rem; letter-spacing:2px; }
</style>
</head>
<body>
<div class="logo">TUNING DAY <span>CAZIS</span> · 2026</div>
<div class="card">
  <div id="step1">
    <h1>VOTE</h1>
    <p class="subtitle">Teilnehmernummer eingeben</p>
    <label for="num">Teilnehmernummer</label>
    <input type="number" id="num" placeholder="001" min="1" max="999">
    <div class="error" id="err"></div>
    <button class="btn btn-primary" onclick="weiter()">WEITER →</button>
  </div>
  <div id="step2" style="display:none">
    <p class="subtitle">Du stimmst ab für</p>
    <div class="big-number" id="bigNum">—</div>
    <p class="confirm-text">Ist das die richtige Nummer?</p>
    <button class="btn btn-primary" onclick="abstimmen()">✓ JA, ABSTIMMEN</button>
    <button class="btn btn-secondary" onclick="zurueck()">← Zurück</button>
  </div>
  <div id="step3" style="display:none">
    <p class="loading">WIRD GESPEICHERT...</p>
  </div>
  <div id="step4" style="display:none">
    <div class="checkmark">🏁</div>
    <div class="done-title">DANKE!</div>
    <p class="done-sub">Deine Stimme wurde gezählt.</p>
    <div class="voted-for">Abgestimmt für Nr. <span id="doneNum">—</span></div>
  </div>
</div>
<div class="footer">1 STIMME PRO GERÄT</div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbwlzPurz23i9rFRZ_KIDxHHq-K1VkwAzaFaX1Kq93PDh-NxF60i9nxGn5el9RFitQY3/exec';
  const VOTED_KEY = 'tdc2026_voted';

  function zeige(id) {
    ['step1','step2','step3','step4'].forEach(s => {
      document.getElementById(s).style.display = s === id ? 'block' : 'none';
    });
  }

  const schonGevoted = localStorage.getItem(VOTED_KEY);
  if (schonGevoted) {
    document.getElementById('doneNum').textContent = schonGevoted;
    zeige('step4');
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('auto')) document.getElementById('num').value = params.get('auto');

  function weiter() {
    const val = parseInt(document.getElementById('num').value);
    if (!val || val < 1 || val > 999) {
      document.getElementById('err').textContent = 'Bitte gültige Nummer eingeben.';
      return;
    }
    document.getElementById('err').textContent = '';
    document.getElementById('bigNum').textContent = String(val).padStart(3,'0');
    zeige('step2');
  }

  function zurueck() { zeige('step1'); }

  async function abstimmen() {
    const num = document.getElementById('bigNum').textContent;
    zeige('step3');
    try {
      await fetch(API + '?nummer=' + parseInt(num), { method: 'GET', mode: 'no-cors' });
      localStorage.setItem(VOTED_KEY, num);
      document.getElementById('doneNum').textContent = num;
      zeige('step4');
    } catch(e) {
      zeige('step2');
      document.getElementById('err').textContent = 'Fehler – bitte nochmal versuchen.';
    }
  }
</script>
</body>
</html>
