<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuning Day Cazis 2026 – Rangliste</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;700&display=swap');
  :root { --bg:#080808; --surface:#111; --border:#222; --accent:#e63a2e; --accent2:#ff6b35; --gold:#ffd700; --silver:#c0c0c0; --bronze:#cd7f32; --text:#f0f0f0; --muted:#666; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; min-height:100vh; padding:2rem; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
  .brand { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:5px; }
  .brand span { color:var(--accent); }
  .live { display:flex; align-items:center; gap:0.5rem; color:var(--accent); font-size:0.8rem; letter-spacing:3px; font-weight:700; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .stats { display:flex; gap:1rem; margin-bottom:1.5rem; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.8rem 1.2rem; flex:1; }
  .stat-label { font-size:0.7rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; color:var(--accent2); }
  .admin { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem; margin-bottom:1.5rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
  .admin input { background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'Bebas Neue',sans-serif; font-size:1.2rem; padding:0.4rem 0.8rem; width:90px; text-align:center; outline:none; -moz-appearance:textfield; }
  .admin input::-webkit-inner-spin-button { -webkit-appearance:none; }
  .btn-add { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:6px; color:white; font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:2px; padding:0.4rem 1.2rem; cursor:pointer; }
  .btn-reset { background:transparent; border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:0.85rem; padding:0.4rem 0.8rem; cursor:pointer; margin-left:auto; }
  .btn-reset:hover { border-color:var(--accent); color:var(--accent); }
  .list-head { display:grid; grid-template-columns:50px 70px 1fr 80px 90px; gap:1rem; padding:0 1rem 0.5rem; font-size:0.7rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); margin-bottom:0.5rem; }
  ul { list-style:none; }
  li.row { display:grid; grid-template-columns:50px 70px 1fr 80px 90px; gap:1rem; align-items:center; padding:0.8rem 1rem; border-radius:8px; margin-bottom:0.3rem; background:var(--surface); border:1px solid var(--border); }
  li.r1 { border-color:var(--gold); background:rgba(255,215,0,0.05); }
  li.r2 { border-color:var(--silver); background:rgba(192,192,192,0.04); }
  li.r3 { border-color:var(--bronze); background:rgba(205,127,50,0.04); }
  .rank { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; }
  .r1 .rank { color:var(--gold); } .r2 .rank { color:var(--silver); } .r3 .rank { color:var(--bronze); }
  .nr { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; }
  .bar-wrap { height:5px; background:var(--border); border-radius:3px; }
  .bar { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 0.6s ease; }
  .r1 .bar { background:linear-gradient(90deg,#b8860b,var(--gold)); }
  .cnt { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; text-align:right; }
  .pct { color:var(--muted); font-size:0.85rem; text-align:right; }
  .empty { text-align:center; color:var(--muted); padding:3rem; letter-spacing:2px; text-transform:uppercase; }
  footer { margin-top:1.5rem; text-align:center; color:var(--border); font-size:0.7rem; letter-spacing:3px; }
</style>
</head>
<body>
<header>
  <div class="brand">TUNING DAY <span>CAZIS</span> · 2026</div>
  <div class="live"><div class="dot"></div>LIVE</div>
</header>
<div class="stats">
  <div class="stat"><div class="stat-label">Stimmen</div><div class="stat-val" id="total">0</div></div>
  <div class="stat"><div class="stat-label">Teilnehmer</div><div class="stat-val" id="teiln">0</div></div>
  <div class="stat"><div class="stat-label">Führend</div><div class="stat-val" id="lead">—</div></div>
</div>
<div class="admin">
  <span style="font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted)">Manuell:</span>
  <input type="number" id="manNum" placeholder="042" min="1" max="999">
  <button class="btn-add" onclick="manuell()">+ STIMME</button>
  <button class="btn-reset" onclick="resetAll()">🗑 Zurücksetzen</button>
</div>
<div class="list-head"><span>Platz</span><span>Nr.</span><span>Balken</span><span style="text-align:right">Stimmen</span><span style="text-align:right">Anteil</span></div>
<ul id="liste"><li class="empty">Warte auf Abstimmungen...</li></ul>
<footer>Tuning Day Cazis 2026 · Live Auswertung</footer>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbwlzPurz23i9rFRZ_KIDxHHq-K1VkwAzaFaX1Kq93PDh-NxF60i9nxGn5el9RFitQY3/exec';

  async function laden() {
    try {
      const res = await fetch(API);
      const votes = await res.json();
      render(votes);
    } catch(e) {}
  }

  async function manuell() {
    const val = parseInt(document.getElementById('manNum').value);
    if (!val || val < 1 || val > 999) return;
    await fetch(API + '?nummer=' + val);
    document.getElementById('manNum').value = '';
    laden();
  }

  async function resetAll() {
    if (!confirm('Wirklich alle Stimmen löschen?')) return;
    await fetch(API + '?reset=true');
    laden();
  }

  function render(votes) {
    const sorted = Object.entries(votes)
      .map(([k,v]) => ({ nr: parseInt(k), cnt: v }))
      .sort((a,b) => b.cnt - a.cnt);
    const total = sorted.reduce((s,r) => s + r.cnt, 0);
    const max = sorted[0]?.cnt || 1;
    document.getElementById('total').textContent = total;
    document.getElementById('teiln').textContent = sorted.length;
    document.getElementById('lead').textContent = sorted[0] ? '#' + String(sorted[0].nr).padStart(3,'0') : '—';
    const ul = document.getElementById('liste');
    if (!sorted.length) { ul.innerHTML = '<li class="empty">Noch keine Stimmen...</li>'; return; }
    const medals = ['🥇','🥈','🥉'];
    ul.innerHTML = sorted.map((r,i) => {
      const cls = i < 3 ? 'r'+(i+1) : '';
      const medal = i < 3 ? medals[i] : '#'+(i+1);
      const pct = total ? Math.round(r.cnt/total*100) : 0;
      const w = Math.round(r.cnt/max*100);
      return '<li class="row '+cls+'"><div class="rank">'+medal+'</div><div class="nr">'+String(r.nr).padStart(3,'0')+'</div><div class="bar-wrap"><div class="bar" style="width:'+w+'%"></div></div><div class="cnt">'+r.cnt+'</div><div class="pct">'+pct+'%</div></li>';
    }).join('');
  }

  document.getElementById('manNum').addEventListener('keydown', e => { if(e.key==='Enter') manuell(); });
  laden();
  setInterval(laden, 5000);
</script>
</body>
</html>
